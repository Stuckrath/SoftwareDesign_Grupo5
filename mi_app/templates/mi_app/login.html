<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1f4d2e;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #f5f5f5;
        }

        .login-contenedor {
            width: 90%;
            max-width: 500px;
            padding: 32px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .descripcion {
            font-size: 1rem;
            color: #d9f2d9;
            margin-bottom: 24px;
        }

        .mensaje-error {
            color: #ffb3b3;
            margin-bottom: 16px;
            font-weight: 500;
        }

        form {
            display: grid;
            gap: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        input {
            width: 90%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background-color: rgba(255, 255, 255, 0.08);
            color: #f5f5f5;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #80c080;
            box-shadow: 0 0 0 3px rgba(128, 192, 128, 0.18);
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background-color: #4CAF50;
            transition: background-color 0.2s ease, transform 0.2s ease;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background-color: #43a047;
            transform: translateY(-2px);
        }

        .acciones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .reset-link {
            color: #a8e0a0;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .reset-link:hover {
            text-decoration: underline;
        }

        .volver {
            position: fixed;
            top: 24px;
            left: 24px;
            background-color: #1f4d2edc;
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #f5f5f5;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 1.2rem;
            text-decoration: none;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .volver:hover {
            background-color: rgba(231, 49, 49, 0.25);
            border-color: rgba(255, 211, 211, 0.6);
        }
    </style>
</head>
<body>
    <div class="login-contenedor">
        <img src="{% static 'mi_app/HospitalPlaceholder.png' %}" alt="Hospital Placeholder" style="width: 80%; height: auto; margin: 0 auto 20px; display: block;" />
        <h2>Ingresa tus datos de login</h2>
        <p class="descripcion">Ingresa tu RUT y contraseña para continuar en la plataforma.</p>

        {% if messages %}
            {% for message in messages %}
                <p class="mensaje-error">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div>
                <label>RUT (sin puntos ni guión):</label>
                <input type="text" name="rut" required>
            </div>
            <div>
                <label>Contraseña:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Ingresar</button>
        </form>

        <div class="acciones">
            <a class="volver" href="{% url 'inicio' %}">Volver</a>
            <a class="reset-link" href="{% url 'password_reset' %}" target="_blank" rel="noopener">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
</body>
</html>
