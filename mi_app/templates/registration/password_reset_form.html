<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
</head>
<body>
    <h2>Restablecer contraseña</h2>
    <p>Introduce tu correo electrónico para recibir un enlace de restauración.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.email.label_tag }}<br>
        {{ form.email }}<br><br>
        <button type="submit">Enviar enlace</button>
    </form>
</body>
</html>
